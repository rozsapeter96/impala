#
# Iceberg REST catalog configuration for credential-vending tests.
# Points at the Lakekeeper + RustFS stack started by run-lakekeeper-s3.sh.
#
# Lakekeeper vends scoped, temporary S3 credentials (access-key-id,
# secret-access-key, session-token) per table in the LoadTableResponse.
# Impala's VendedCredential.toHadoopConfig() translates these to Hadoop
# fs.s3a.* keys so S3AFileSystem authenticates to RustFS.  The RustFS endpoint
# and path-style-access flag are cluster-wide settings supplied via
# core-site.xml (S3_ENDPOINT), not via the vended credentials.

connector.name=iceberg
iceberg.catalog.type=rest

# Lakekeeper REST catalog endpoint (run-lakekeeper-s3.sh starts it on :8181)
iceberg.rest-catalog.uri=http://localhost:8181/catalog

# Warehouse name as registered in Lakekeeper
iceberg.rest-catalog.warehouse=impala_s3_test

# Enable credential vending.  Lakekeeper will include per-table STS credentials
# in each LoadTableResponse; Impala forwards them to the backend via TVendedCredential.
iceberg.rest-catalog.vended-credentials-enabled=true

# OAuth2 authentication to Lakekeeper using the impala-client configured in
# realm-config.json.  ${ENV:...} substitutions are resolved by ConfigLoader so the
# client secret can be supplied via an environment variable in CI.
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=impala-client:impala-client-secret
iceberg.rest-catalog.oauth2.server-uri=http://localhost:7071/realms/lakekeeper-realm/protocol/openid-connect/token
