#
# Negative-test variant of the vended-credentials REST catalog config.
# Identical to iceberg_s3_vended_config except that credential vending is
# DISABLED.  With no vended credentials and no ambient S3 credentials, a scan
# of the S3-backed table must fail to authenticate to RustFS — proving that the
# vended credentials are what make the positive test succeed.

connector.name=iceberg
iceberg.catalog.type=rest

iceberg.rest-catalog.uri=http://localhost:8181/catalog
iceberg.rest-catalog.warehouse=impala_s3_test

# Vending disabled: no per-table S3 credentials are sent to the backend.
iceberg.rest-catalog.vended-credentials-enabled=false

iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=impala-client:impala-client-secret
iceberg.rest-catalog.oauth2.server-uri=http://localhost:7071/realms/lakekeeper-realm/protocol/openid-connect/token
